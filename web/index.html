<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Influencer Connect - Web Platform">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Influencer Connect">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    
    <title>Influencer Connect</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png"/>
</head>
<body>
    <script>
        var serviceWorkerVersion = null;
        var scriptLoaded = false;
        function loadMainDartJs() {
            if (scriptLoaded) {
                return;
            }
            scriptLoaded = true;
            var scriptTag = document.createElement('script');
            scriptTag.src = 'main.dart.js';
            scriptTag.type = 'application/javascript';
            document.body.append(scriptTag);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('flutter_service_worker.js?v=' + serviceWorkerVersion)
                    .then(reg => {
                        function refreshPage() {
                            window.location.reload();
                        }
                        if (reg.waiting != null) {
                            refreshPage();
                        } else if (reg.installing != null) {
                            reg.installing.addEventListener('statechange', () => {
                                if (reg.installing.state === 'installed') {
                                    refreshPage();
                                }
                            });
                        } else if (reg.active != null) {
                            reg.addEventListener('updatefound', () => {
                                reg.installing.addEventListener('statechange', () => {
                                    if (reg.installing.state === 'installed') {
                                        refreshPage();
                                    }
                                });
                            });
                        }
                    }).catch(err => console.error('Flutter Service Worker registration failed:', err));
            });
        }
        loadMainDartJs();
    </script>
</body>
</html>
